name: Shorts code checks

on:
  pull_request:
    paths:
      - "scripts/shorts_preflight.py"
      - "scripts/fetch_rates.py"
      - "scripts/rate_change_utils.py"
      - "scripts/build_shorts.py"
      - "scripts/upload_shorts.py"
      - "scripts/check_youtube_connection.py"
      - "requirements-shorts.txt"
      - "tests/test_shorts_pipeline.py"
      - ".github/workflows/build-shorts.yml"
      - ".github/workflows/shorts-checks.yml"
      - ".github/workflows/verify-youtube-connection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system fonts
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          timeout --kill-after=10s 90s sudo apt-get $APT_OPTS update -qq || echo "::warning::apt-get update stalled; retrying install with runner package indexes"
          timeout --kill-after=10s 300s sudo apt-get $APT_OPTS install -y --no-install-recommends fontconfig fonts-noto-core fonts-noto-extra fonts-dejavu-core libraqm-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libjpeg-dev zlib1g-dev
      - name: Install Python packages with RAQM shaping support
        timeout-minutes: 8
        run: |
          python -m pip install -r requirements-shorts.txt
          python -m pip install --force-reinstall --no-binary=Pillow "Pillow>=10.4,<13"
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Pillow RAQM shaping is required for Malayalam'"
      - name: Compile Python
        run: python -m py_compile scripts/shorts_preflight.py scripts/fetch_rates.py scripts/rate_change_utils.py scripts/build_shorts.py scripts/upload_shorts.py scripts/check_youtube_connection.py tests/test_shorts_pipeline.py
      - name: Test card design and script content
        run: python -m unittest discover -s tests -p 'test_shorts_pipeline.py' -v
