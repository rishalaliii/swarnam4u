name: Shorts code checks

on:
  pull_request:
    paths:
      - "scripts/shorts_preflight.py"
      - "scripts/build_shorts.py"
      - "requirements-shorts.txt"
      - "tests/test_shorts_pipeline.py"
      - ".github/workflows/build-shorts.yml"
      - ".github/workflows/shorts-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-core fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install -r requirements-shorts.txt
      - name: Compile Python
        run: python -m py_compile scripts/shorts_preflight.py scripts/build_shorts.py tests/test_shorts_pipeline.py
      - name: Test card design and script content
        run: python -m unittest tests.test_shorts_pipeline -v
