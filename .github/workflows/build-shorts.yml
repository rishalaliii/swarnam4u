name: Build Swarnam4U Shorts

on:
  # Fetch rates and build videos only for the scheduled publication slots.
  # Manual workflow_dispatch remains available for an intentional test/build.
  schedule:
    # AKGSMA usually publishes around 10:00 IST. Keep a build/upload buffer before each release.
    # Scheduled releases are 10:45, 13:15 and 17:15 IST to reduce late-upload failures.
    - cron: "42 4 * * *"   # 10:12 IST -> morning slot, 33-minute buffer
    - cron: "2 7 * * *"    # 12:32 IST -> midday slot, 43-minute buffer
    - cron: "2 11 * * *"   # 16:32 IST -> evening slot, 43-minute buffer
  workflow_dispatch:
    inputs:
      slot:
        description: "Which bilingual pair to render"
        required: true
        type: choice
        options:
          - morning
          - midday
          - evening
      publish_mode:
        description: "Build only, schedule privately using automation, or publish both videos publicly now"
        required: true
        type: choice
        options:
          - build_only
          - schedule_private
          - public_now
        default: build_only

permissions:
  contents: read

concurrency:
  # Serialize the same scheduled/manual slot so duplicate runs cannot publish twice.
  # Scheduled and manual runs share a slot lock; unrelated manual runs get a unique group.
  group: swarnam4u-shorts-build-${{ inputs.slot || (github.event.schedule == '42 4 * * *' && 'morning') || (github.event.schedule == '2 7 * * *' && 'midday') || (github.event.schedule == '2 11 * * *' && 'evening') || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        timeout-minutes: 8
        run: |
          # GitHub-hosted Ubuntu runners can hang on azure.archive.ubuntu.com; use the standard archive mirror.
          for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$file" ]]; then sudo sed -i "s/azure\\.archive\\.ubuntu\\.com/archive.ubuntu.com/g" "$file"; fi
          done
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          timeout --kill-after=10s 90s sudo apt-get $APT_OPTS update -qq || echo "::warning::apt-get update stalled; retrying install with runner package indexes"
          timeout --kill-after=10s 300s sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-dejavu-core libraqm-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libjpeg-dev zlib1g-dev
      - name: Install Python packages with RAQM shaping support
        timeout-minutes: 8
        run: |
          python -m pip install -r requirements-shorts.txt
          python -m pip install --force-reinstall --no-binary=Pillow "Pillow>=10.4,<13"
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Pillow RAQM shaping is required for Malayalam'"
      - name: Refresh rates and validate live board (retry transient source failures)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Live-rate fetch/preflight attempt $attempt of 3"
            if python scripts/fetch_rates.py && python scripts/shorts_preflight.py; then
              echo "Live rates fetched and preflight passed."
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "::warning::Live-rate attempt $attempt failed; retrying in 25 seconds."
              sleep 25
            fi
          done
          echo "::error::Live rates could not be fetched and validated after 3 attempts. Refusing to publish stale rates."
          exit 1
      - name: Validate scheduled publishing configuration
        if: github.event_name == 'schedule' && vars.YOUTUBE_AUTO_PUBLISH == 'true' && vars.YOUTUBE_UPLOAD_KILL_SWITCH != 'true'
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          test -n "$YOUTUBE_CLIENT_SECRET_JSON" || { echo "::error::Missing repository secret YOUTUBE_CLIENT_SECRET_JSON"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "::error::Missing repository secret YOUTUBE_REFRESH_TOKEN"; exit 1; }
          python - <<'PY'
          import json, os, sys
          try:
              raw = json.loads(os.environ["YOUTUBE_CLIENT_SECRET_JSON"])
          except Exception:
              print("::error::YOUTUBE_CLIENT_SECRET_JSON is not valid JSON")
              sys.exit(1)
          cfg = raw.get("installed") or raw.get("web")
          if not isinstance(cfg, dict) or not cfg.get("client_id") or not cfg.get("client_secret"):
              print("::error::OAuth JSON must contain installed/web client_id and client_secret fields")
              sys.exit(1)
          print("Scheduled publishing configuration is present; OAuth/channel authorization will be verified by the uploader.")
          PY
      - name: Require automatic publishing to be enabled
        if: github.event_name == 'schedule' && vars.YOUTUBE_UPLOAD_KILL_SWITCH != 'true' && vars.YOUTUBE_AUTO_PUBLISH != 'true'
        run: |
          echo "::error::Scheduled publishing is not enabled. Set repository variable YOUTUBE_AUTO_PUBLISH to the exact string true. This run is stopped instead of silently generating videos without publishing."
          exit 1
      - name: Explain emergency publishing stop
        if: github.event_name == 'schedule' && vars.YOUTUBE_UPLOAD_KILL_SWITCH == 'true'
        run: echo "::warning::YOUTUBE_UPLOAD_KILL_SWITCH is true. Videos may be built, but all YouTube uploads are intentionally blocked."
      - name: Resolve the scheduled slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SLOT="$INPUT_SLOT"
          else
            case "$SCHEDULE" in
              "42 4 * * *") SLOT="morning" ;;
              "2 7 * * *") SLOT="midday" ;;
              "2 11 * * *") SLOT="evening" ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Building slot: $SLOT"
      - name: Build English + Malayalam Shorts
        env:
          # The manifest is upload-enabled only when this run explicitly requests publishing
          # or is a scheduled run with auto-publishing enabled, and the kill switch is off.
          YOUTUBE_AUTO_PUBLISH: ${{ vars.YOUTUBE_UPLOAD_KILL_SWITCH != 'true' && ((github.event_name == 'schedule' && vars.YOUTUBE_AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.publish_mode == 'schedule_private' || inputs.publish_mode == 'public_now') && (inputs.publish_mode == 'public_now' || vars.YOUTUBE_AUTO_PUBLISH == 'true')) ) }}
          SHORTS_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'public_now' && 'public_now' || 'scheduled_private' }}
          SHORTS_USE_CURRENT_TIME: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/build_shorts.py --slot "${{ steps.slot.outputs.slot }}"
      - name: Emergency stop — uploads disabled
        if: vars.YOUTUBE_UPLOAD_KILL_SWITCH == 'true'
        run: echo "Emergency stop is ON. Videos were generated, but all YouTube uploads are blocked."
      - name: Publish to YouTube
        if: vars.YOUTUBE_UPLOAD_KILL_SWITCH != 'true' && ((github.event_name == 'schedule' && vars.YOUTUBE_AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'schedule_private' && vars.YOUTUBE_AUTO_PUBLISH == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'public_now'))
        env:
          SHORTS_SLOT: ${{ steps.slot.outputs.slot }}
          SHORTS_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'public_now' && 'public_now' || 'scheduled_private' }}
          YOUTUBE_UPLOAD_KILL_SWITCH: ${{ vars.YOUTUBE_UPLOAD_KILL_SWITCH || 'false' }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EXPECTED_CHANNEL_HANDLE: ${{ vars.YOUTUBE_EXPECTED_CHANNEL_HANDLE || '@SWARANAM4U' }}
        run: python scripts/upload_shorts.py
      - name: Upload generated files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarnam4u-shorts-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
