name: Build Swarnam4U Shorts

on:
  # Build a fresh review artifact after production pipeline code changes; push runs never publish.
  push:
    branches: [main]
    paths:
      - "scripts/build_shorts.py"
      - "scripts/fetch_rates.py"
      - "scripts/shorts_preflight.py"
      - "scripts/rate_change_utils.py"
      - "scripts/upload_shorts.py"
      - "requirements-shorts.txt"
      - ".github/workflows/build-shorts.yml"
  schedule:
    # AKGSMA publishes the daily board around 10:00 IST, so morning build starts afterwards.
    # 10:10, 12:45 and 16:45 India time. GitHub Actions can be delayed.
    - cron: "40 4 * * *"   # 10:10 IST -> morning slot
    - cron: "15 7 * * *"   # 12:45 IST -> midday slot
    - cron: "15 11 * * *"  # 16:45 IST -> evening slot
  workflow_dispatch:
    inputs:
      slot:
        description: "Which bilingual pair to render"
        required: true
        type: choice
        options:
          - morning
          - midday
          - evening
      publish_now:
        description: "For a manual run, also schedule the videos on YouTube (otherwise build files only)"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

concurrency:
  # Serialize the same scheduled/manual slot, but never let a push-only artifact build
  # block a future scheduled publication if a runner stalls.
  group: swarnam4u-shorts-build-${{ github.event.schedule || inputs.slot || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          timeout --kill-after=10s 90s sudo apt-get $APT_OPTS update -qq || echo "::warning::apt-get update stalled; retrying install with runner package indexes"
          timeout --kill-after=10s 300s sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg fontconfig fonts-noto-core fonts-noto-extra fonts-dejavu-core libraqm-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libjpeg-dev zlib1g-dev
      - name: Install Python packages with RAQM shaping support
        timeout-minutes: 8
        run: |
          python -m pip install -r requirements-shorts.txt
          python -m pip install --force-reinstall --no-binary=Pillow "Pillow>=10.4,<13"
          python -c "from PIL import features; assert features.check_feature('raqm'), 'Pillow RAQM shaping is required for Malayalam'"
      - name: Refresh working copy from live AKGSMA board
        run: python scripts/fetch_rates.py
      - name: Validate live board date and saved rates
        run: python scripts/shorts_preflight.py
      - name: Resolve the scheduled slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SLOT="$INPUT_SLOT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # Artifact-only verification build after production code changes.
            SLOT="morning"
          else
            case "$SCHEDULE" in
              "40 4 * * *") SLOT="morning" ;;
              "15 7 * * *") SLOT="midday" ;;
              "15 11 * * *") SLOT="evening" ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 2 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Building slot: $SLOT"
      - name: Build English + Malayalam Shorts
        env:
          YOUTUBE_AUTO_PUBLISH: ${{ vars.YOUTUBE_AUTO_PUBLISH == 'true' && (github.event_name == 'schedule' || inputs.publish_now == 'true') }}
        run: python scripts/build_shorts.py --slot "${{ steps.slot.outputs.slot }}"
      - name: Publish to YouTube (explicit opt-in only)
        if: vars.YOUTUBE_AUTO_PUBLISH == 'true' && (github.event_name == 'schedule' || inputs.publish_now == 'true')
        env:
          SHORTS_SLOT: ${{ steps.slot.outputs.slot }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_shorts.py
      - name: Upload generated files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarnam4u-shorts-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
