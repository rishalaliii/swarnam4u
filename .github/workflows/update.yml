name: Update rates
on:
  # Scheduled polling plus a one-time/diagnostic run whenever the updater itself changes.
  # Avoid minute zero and common top-of-hour congestion.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"
      - "scripts/fetch_rates.py"
      - "scripts/import_goodreturns.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rate-fetch dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch and validate rates
        run: python scripts/fetch_rates.py
      - name: Import recent history (non-blocking)
        run: python scripts/import_goodreturns.py || true
      - name: Commit rate changes if needed
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git pull --rebase && git push)
