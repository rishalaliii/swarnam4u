name: Update rates
on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 min (GitHub may delay runs a few minutes)
  workflow_dispatch:
  push:
    paths: ["scripts/fetch_rates.py", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency:
  group: update-rates          # never run two updates at once
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_rates.py
      - run: python scripts/import_goodreturns.py || true   # adds GoodReturns' last-10-days table; never blocks the update
      - run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git pull --rebase && git push)
